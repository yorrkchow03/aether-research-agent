[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-research-agent"
version = "0.2.0"
description = "Aether: local Deep Agents ETH research with live APIs, Doubao, shell analysis and dashboard"
requires-python = ">=3.12,<3.15"
dependencies = [
    "deepagents==0.7.23",
    "langchain-openai==1.7.0",
    "python-dotenv==1.2.4",
    "fastapi==0.143.0",
    "uvicorn==0.54.0",
    "langgraph-checkpoint-sqlite==3.1.2",
    "numpy==2.5.4",
    "scikit-learn==1.9.1",
    "pypdf==6.21.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
research_agent = ["web/*.html", "web/*.css", "web/*.js", "skills/*/SKILL.md", "skills/*/references/*.md", "skills/*/scripts/*.py"]
