name: Offline verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python scripts/dev/check_repository.py
      - run: python -m unittest discover -s tests -q
      - run: python scripts/dev/check_install.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/research_agent/web/dashboard.js
      - run: node --check src/research_agent/web/investment.js
      - run: node --check src/research_agent/web/desk.js
      - run: node --check src/research_agent/web/research-lab.js
      - run: python scripts/dev/export_source.py
