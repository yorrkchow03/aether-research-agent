<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<title>Aether Agent 框架解释图</title>
<desc>当前单主 Agent 的本地 Deep Agents LangGraph 框架。指令和技能指导豆包模型先制订计划，再自主使用数据接口、搜索、终端和记忆。草稿经程序核验及独立上下文模型审核后发布。Jev 三阶段闭环仅为拟研究扩展。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#8B98AC"/></marker>
  <marker id="violetArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#8778BF"/></marker>
  <marker id="returnArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#BD8651"/></marker>
</defs>
<style>text{font-family:Arial,"PingFang SC","Heiti SC","Microsoft YaHei",sans-serif} .line{fill:none;stroke:#8B98AC;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}</style>
<rect width="1920" height="1080" fill="#FFFFFF"/>

<text x="64" y="70" font-size="46" font-weight="700" fill="#17243D" text-anchor="start" data-max-width="1780">Aether Agent 框架</text>
<text x="64" y="116" font-size="27" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="1780">按计划使用工具与记忆，生成带来源的研究报告</text>
<rect x="400" y="160" width="430" height="110" rx="18" fill="#F8FAFD" stroke="#D7DEE9" stroke-width="2"/>
<text x="430" y="197" font-size="28" font-weight="700" fill="#25324A" text-anchor="start" data-max-width="370">System Prompt</text>
<text x="430" y="232" font-size="23" font-weight="400" fill="#25324A" text-anchor="start" data-max-width="370">角色、任务边界与来源规则</text>
<text x="430" y="256" font-size="19" font-weight="400" fill="#697891" text-anchor="start" data-max-width="370">随任务进入模型上下文</text>
<rect x="860" y="160" width="430" height="110" rx="18" fill="#F8FAFD" stroke="#D7DEE9" stroke-width="2"/>
<text x="890" y="197" font-size="28" font-weight="700" fill="#25324A" text-anchor="start" data-max-width="370">Skills</text>
<text x="890" y="232" font-size="23" font-weight="400" fill="#25324A" text-anchor="start" data-max-width="370">研究 · 量化 · 策略 · 持仓</text>
<text x="890" y="256" font-size="19" font-weight="400" fill="#697891" text-anchor="start" data-max-width="370">模型按需读取完整方法</text>
<path d="M 615 270 L 615 300" fill="none" stroke="#8B98AC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 1075 270 L 1075 300" fill="none" stroke="#8B98AC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="64" y="396" width="276" height="200" rx="18" fill="#EFF6FF" stroke="#C7DBF4" stroke-width="2"/>
<text x="94" y="440" font-size="30" font-weight="700" fill="#25324A" text-anchor="start" data-max-width="216">任务入口</text>
<text x="94" y="483" font-size="26" font-weight="400" fill="#25324A" text-anchor="start" data-max-width="216">用户提问</text>
<text x="94" y="520" font-size="26" font-weight="400" fill="#25324A" text-anchor="start" data-max-width="216">定时简报</text>
<text x="94" y="564" font-size="20" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="216">前端看板 / FastAPI</text>
<path d="M 340 500 L 400 500" fill="none" stroke="#8B98AC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="370" y="480" font-size="18" font-weight="400" fill="#63718A" text-anchor="middle">请求</text>
<rect x="400" y="300" width="890" height="425" rx="22" fill="#F6F3FC" stroke="#BDB1DB" stroke-width="2"/>
<text x="430" y="344" font-size="32" font-weight="700" fill="#4F4085" text-anchor="start" data-max-width="225">本地 Harness</text>
<text x="660" y="342" font-size="24" font-weight="600" fill="#675590" text-anchor="start" data-max-width="355">Deep Agents / LangGraph</text>
<text x="1255" y="342" font-size="21" font-weight="400" fill="#675590" text-anchor="end" data-max-width="180">单主 Agent</text>
<rect x="435" y="382" width="820" height="94" rx="14" fill="#FFFFFF" stroke="#D3C8EA" stroke-width="2"/>
<text x="845" y="420" font-size="29" font-weight="700" fill="#4F4085" text-anchor="middle" data-max-width="760">Doubao Seed 2.1 Pro</text>
<text x="845" y="454" font-size="24" font-weight="400" fill="#25324A" text-anchor="middle" data-max-width="760">通过方舟 API 调用，负责理解、决策与生成</text>
<rect x="435" y="510" width="230" height="88" rx="12" fill="#FFFFFF" stroke="#D3C8EA" stroke-width="2"/>
<text x="550" y="545" font-size="26" font-weight="700" fill="#4F4085" text-anchor="middle" data-max-width="210">1  制订计划</text>
<text x="550" y="578" font-size="17" font-weight="400" fill="#25324A" text-anchor="middle" data-max-width="212">先保存目标、步骤与检查点</text>
<rect x="715" y="510" width="230" height="88" rx="12" fill="#FFFFFF" stroke="#D3C8EA" stroke-width="2"/>
<text x="830" y="545" font-size="26" font-weight="700" fill="#4F4085" text-anchor="middle" data-max-width="210">2  自主研究</text>
<text x="830" y="578" font-size="17" font-weight="400" fill="#25324A" text-anchor="middle" data-max-width="212">调用工具、检索与写代码</text>
<rect x="995" y="510" width="230" height="88" rx="12" fill="#FFFFFF" stroke="#D3C8EA" stroke-width="2"/>
<text x="1110" y="545" font-size="26" font-weight="700" fill="#4F4085" text-anchor="middle" data-max-width="210">3  整理草稿</text>
<text x="1110" y="578" font-size="17" font-weight="400" fill="#25324A" text-anchor="middle" data-max-width="212">综合证据，形成研究结论</text>
<path d="M 670 554 L 707 554" fill="none" stroke="#8778BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#violetArrow)"/>
<path d="M 950 554 L 987 554" fill="none" stroke="#8778BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#violetArrow)"/>
<path d="M 1110 605 L 1110 634 L 550 634 L 550 605" fill="none" stroke="#A696C6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#violetArrow)"/>
<text x="830" y="683" font-size="24" font-weight="400" fill="#6A5B90" text-anchor="middle" data-max-width="770">观察工具结果，必要时调整计划</text>
<rect x="1350" y="345" width="500" height="180" rx="18" fill="#F7FBF9" stroke="#BDD8C9" stroke-width="2"/>
<text x="1380" y="386" font-size="30" font-weight="700" fill="#2C6650" text-anchor="start" data-max-width="440">发布前核验</text>
<text x="1380" y="426" font-size="24" font-weight="400" fill="#25324A" text-anchor="start" data-max-width="440">来源 ID · 数字 · 单位</text>
<text x="1380" y="462" font-size="23" font-weight="400" fill="#25324A" text-anchor="start" data-max-width="440">独立上下文的豆包证据审核</text>
<text x="1380" y="500" font-size="21" font-weight="400" fill="#9B6B39" text-anchor="start" data-max-width="440">不通过 → 返回修订</text>
<path d="M 1290 430 L 1350 430" fill="none" stroke="#8B98AC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1320" y="410" font-size="18" font-weight="400" fill="#63718A" text-anchor="middle">草稿</text>
<path d="M 1350 482 L 1320 482 L 1320 675 L 1290 675" fill="none" stroke="#BD8651" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#returnArrow)"/>
<path d="M 1600 525 L 1600 578" fill="none" stroke="#8B98AC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1632" y="558" font-size="20" font-weight="400" fill="#527263" text-anchor="start">通过</text>
<rect x="1350" y="580" width="500" height="145" rx="18" fill="#F0F7F3" stroke="#BDD8C9" stroke-width="2"/>
<text x="1380" y="623" font-size="30" font-weight="700" fill="#2C6650" text-anchor="start" data-max-width="440">回答 / 研究报告</text>
<text x="1380" y="664" font-size="24" font-weight="400" fill="#25324A" text-anchor="start" data-max-width="440">带来源链接的分析与条件建议</text>
<text x="1380" y="701" font-size="21" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="440">展示在前端看板</text>
<path d="M 615 736 L 615 784" fill="none" stroke="#8B98AC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="637" y="767" font-size="20" font-weight="400" fill="#63718A" text-anchor="start">调用 / 结果</text>
<rect x="400" y="795" width="430" height="204" rx="18" fill="#F5F9FE" stroke="#C8D8EB" stroke-width="2"/>
<text x="430" y="836" font-size="26" font-weight="700" fill="#365D89" text-anchor="start" data-max-width="370">Tools · 灵活获取与计算</text>
<text x="430" y="876" font-size="24" font-weight="400" fill="#25324A" text-anchor="start" data-max-width="370">行情与链上数据 API</text>
<text x="430" y="913" font-size="24" font-weight="400" fill="#25324A" text-anchor="start" data-max-width="370">搜索 + 新闻原文读取</text>
<text x="430" y="950" font-size="22" font-weight="400" fill="#25324A" text-anchor="start" data-max-width="370">终端 / Python / SDK 自主分析</text>
<text x="430" y="980" font-size="19" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="370">输入与计算保留来源记录</text>
<path d="M 1075 736 L 1075 784" fill="none" stroke="#8B98AC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="1097" y="767" font-size="20" font-weight="400" fill="#63718A" text-anchor="start">保存 / 召回</text>
<rect x="860" y="795" width="430" height="204" rx="18" fill="#F5F9FE" stroke="#C8D8EB" stroke-width="2"/>
<text x="890" y="836" font-size="26" font-weight="700" fill="#365D89" text-anchor="start" data-max-width="370">Memory · 状态与资料</text>
<text x="890" y="876" font-size="23" font-weight="400" fill="#25324A" text-anchor="start" data-max-width="370">短期：会话、计划与工具状态</text>
<text x="890" y="913" font-size="22" font-weight="400" fill="#25324A" text-anchor="start" data-max-width="370">长期：新闻、事件、报告与偏好</text>
<text x="890" y="950" font-size="22" font-weight="400" fill="#25324A" text-anchor="start" data-max-width="370">保存原文与版本，按需检索召回</text>
<text x="890" y="980" font-size="19" font-weight="400" fill="#63718A" text-anchor="start" data-max-width="370">SQLite checkpoints + FTS 检索</text>
<rect x="1350" y="795" width="500" height="204" rx="18" fill="#FFFDF7" stroke="#D4B46A" stroke-width="2" stroke-dasharray="9 7"/>
<text x="1380" y="835" font-size="28" font-weight="700" fill="#906D20" text-anchor="start" data-max-width="440">Jev 扩展 · 拟研究</text>
<text x="1380" y="871" font-size="23" font-weight="400" fill="#25324A" text-anchor="start" data-max-width="440">① 新闻分类</text>
<text x="1380" y="905" font-size="23" font-weight="400" fill="#25324A" text-anchor="start" data-max-width="440">② 检索后筛选 / 冲突判断</text>
<text x="1380" y="939" font-size="23" font-weight="400" fill="#25324A" text-anchor="start" data-max-width="440">③ 报告结论核验</text>
<text x="1380" y="978" font-size="20" font-weight="400" fill="#92784B" text-anchor="start" data-max-width="440">三阶段闭环尚未接入主流程</text>
<text x="64" y="1047" font-size="21" font-weight="400" fill="#748197" text-anchor="start" data-max-width="950">实线：当前主流程    虚线框：Jev 拟研究扩展</text>
<text x="1850" y="1047" font-size="21" font-weight="400" fill="#748197" text-anchor="end" data-max-width="650">一个主研究 Agent + 独立审核调用</text>
</svg>